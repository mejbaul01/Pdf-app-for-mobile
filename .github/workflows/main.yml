name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix file places
        run: |
          mkdir -p assets lib
          [ -f icon.png ] && mv -f icon.png assets/
          [ -f icon_fg.png ] && mv -f icon_fg.png assets/
          [ -f main.dart ] && mv -f main.dart lib/
          ls -R assets lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.mejbalimited --project-name aps .
      - name: Manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i 's/android:label="[^"]*"/android:label="APS"/' $M
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --build-name=3.35.0 --build-number=335
      - uses: actions/upload-artifact@v4
        with:
          name: APS-apk
          path: build/app/outputs/flutter-apk/app-release.apk
